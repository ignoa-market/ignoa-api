### 인프라 연결 ###
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  data:
    redis:
      host: redis
      port: 6379

### CloudFront 오리진 검증 ###
ignoa:
  cloudfront-origin:
    enabled: true
    secret: ${CLOUDFRONT_ORIGIN_VERIFY_SECRET}

### 운영·모니터링 ###
server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    tags:
      application: ignoa-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
        lock.hold.time: true
        lock.acquire.wait: true
        hikaricp.connections.acquire: true

sentry:
  dsn: ${SENTRY_DSN}
  send-default-pii: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info