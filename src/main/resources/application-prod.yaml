### 인프라 연결 ###
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: 6379
      ssl:
        enabled: ${REDIS_SSL:true}

### CloudFront 오리진 검증 ###
ignoa:
  cloudfront-origin:
    enabled: true
    secret: ${CLOUDFRONT_ORIGIN_VERIFY_SECRET}

### 운영·모니터링 ###
server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    tags:
      application: ignoa-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
        lock.hold.time: true
        lock.acquire.wait: true
        hikaricp.connections.acquire: true
        auction.close.lag: true
        auction.close.item.duration: true
      maximum-expected-value:
        lock.hold.time: 3s
        lock.acquire.wait: 3s
        auction.close.lag: 5m
        auction.close.item.duration: 3s
      slo:
        lock.acquire.wait: 250ms, 500ms, 1s
        auction.close.lag: 10s

sentry:
  dsn: ${SENTRY_DSN}
  send-default-pii: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
  context-tags: trace_id