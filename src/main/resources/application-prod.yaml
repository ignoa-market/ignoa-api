spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: redis

springdoc:
  swagger-ui:
    config-url: /ignoa/v3/api-docs/swagger-config
    url: /ignoa/v3/api-docs
  servers:
    - url: https://task-api.wisoft.io/ignoa
