server:
  port: 38080

spring:
  application:
    name: Ignoa API

  profiles:
    default: local

  jackson:
    property-naming-strategy: SNAKE_CASE

  data:
    redis:
      port: 36379

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cloud:
  aws:
    s3:
      endpoint: ${S3_ENDPOINT}
      bucket: ${S3_BUCKET}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      region: ${S3_REGION}
      presigned-url-expiration: ${S3_PRESIGNED_EXPIRATION}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
