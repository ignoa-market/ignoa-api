### 기본 설정 ###
server:
  port: 38080

logging:
  level:
    root: INFO
    io.wisoft.ignoa_api: ${APP_LOG_LEVEL:INFO}
  pattern:
    correlation: "[%X{trace_id:-},%X{span_id:-}] "

### Spring 공통 ###
spring:
  application:
    name: Ignoa API

  profiles:
    default: local

  jackson:
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # DB·Redis 연결
  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 500

  data:
    redis:
      connect-timeout: 500ms
      timeout: 500ms
      lettuce:
        pool:
          max-wait: 500ms

### Redisson (분산 락) ###
ignoa:
  redis:
    redisson:
      connect-timeout: 500ms
      response-timeout: 500ms
      retry-attempts: 1
      retry-delay: 100ms

### 인증 ###
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me

### AWS (S3·CloudFront) ###
cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
      region: ${S3_REGION}
    cloudfront:
      media-base-url: https://ignoa.woomin.dev
