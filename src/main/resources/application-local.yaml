### 인프라 연결 ###
spring:
  datasource:
    url: jdbc:mysql://localhost:33306/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false # 쿼리 성능 분석 시 true로 켜서 쿼리 수·실행 시간 확인
    open-in-view: false # 트랜잭션 종료 시 커넥션 반환, 컨트롤러에서 지연 로딩 불가

  data:
    redis:
      host: localhost
      port: 36379
