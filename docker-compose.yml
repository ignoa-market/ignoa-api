services:
  mysql:
    image: mysql:8.0
    platform: linux/arm64
    container_name: ignoa-mysql
    env_file: .env
    environment:
      TZ: Asia/Seoul
    ports:
      - "33306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    platform: linux/arm64
    container_name: ignoa-redis
    environment:
      TZ: Asia/Seoul
    ports:
      - "36379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --notify-keyspace-events Ex

  app:
    build: .
    container_name: ignoa-api
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
    ports:
      - "38080:38080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
