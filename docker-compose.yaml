services:
  mysql:
    image: mysql:8.0
    container_name: ignoa-mysql
    env_file: .env
    environment:
      TZ: Asia/Seoul
    ports:
      - "33306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: ignoa-redis
    ports:
      - "36379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  app:
    image: ghcr.io/ignoa-market/ignoa-api:${IMAGE_TAG:-prod}
    container_name: ignoa-api
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
    ports:
      - "38080:38080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:38080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
