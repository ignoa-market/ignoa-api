name: CI

# Event: main으로 PR이 열릴 때 트리거
on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Runner: GitHub 클라우드 우분투 서버 생성
    runs-on: ubuntu-latest
    # Runner가 20분 이상 걸리면 강제 종료
    timeout-minutes: 20

    # Job 실행 전 MySQL, Redis 컨테이너 기동
    # health-cmd: 컨테이너가 실제로 준비될 때까지 대기
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: ignoa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      # Step 1: 레포 소스코드를 Runner 서버로 내려받기
      - uses: actions/checkout@v4

      # Step 2: Runner에 Java 21 설치
      # Runner는 매번 새 서버라 직접 설치 필요
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Gradle 의존성 캐싱
      # build.gradle 변경 없으면 이전 캐시 재사용 → 빌드 시간 단축
      # restore-keys: 완전 일치 캐시 없으면 이전 캐시라도 부분 재사용
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 4: GitHub Secret에서 CI용 .env 복원
      # Secret을 env로 먼저 받아 특수문자 깨짐 방지
      - name: Create .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE" > .env

      # Step 5: ./gradlew 실행 권한 부여
      - name: Grant Gradle Permission
        run: chmod +x gradlew

      # Step 6: 빌드 + 테스트 실행
      # ci 프로파일 활성화 → application-ci.yaml 적용
      - name: Build & Test
        run: ./gradlew build
        env:
          SPRING_PROFILES_ACTIVE: ci